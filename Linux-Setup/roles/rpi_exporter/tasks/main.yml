---
- name: Set architecture-specific binary name
  ansible.builtin.set_fact:
    rpi_exporter_arch: "{{ architecture_mapping[ansible_architecture].rpi_exporter | default(repositories.rpi_exporter.architecture) }}"
  when:
    - architecture_mapping is defined
    - ansible_architecture in architecture_mapping
    - architecture_mapping[ansible_architecture].rpi_exporter != "NOT_AVAILABLE"

- name: Check if RPi Exporter is available for this architecture
  ansible.builtin.set_fact:
    rpi_exporter_skip: true
  when:
    - architecture_mapping is defined
    - ansible_architecture in architecture_mapping
    - architecture_mapping[ansible_architecture].rpi_exporter == "NOT_AVAILABLE"

- name: Display RPi Exporter skip message for x86_64
  ansible.builtin.debug:
    msg: "Skipping RPi Exporter installation - not available for {{ ansible_architecture }} architecture (ARM only)"
  when: rpi_exporter_skip | default(false)

- name: Build CLI arguments
  ansible.builtin.set_fact:
    rpi_exporter_cli_args: " {{ rpi_exporter_extra_args }}"
  when: not (rpi_exporter_skip | default(false))

- name: Creating RPi exporter user group
  become: true
  ansible.builtin.group:
    name: "{{ rpi_exporter_groupid }}"
    state: present
  when: not (rpi_exporter_skip | default(false))

- name: Creating RPi exporter user
  become: true
  ansible.builtin.user:
    name: "{{ rpi_exporter_userid }}"
    group: "{{ rpi_exporter_groupid }}"
    groups: "{{ 'video' if rpi_exporter_video_group_access else '' }}"
    system: true
    shell: "/sbin/nologin"
    comment: "{{ rpi_exporter_userid }} nologin User"
    createhome: "no"
    state: present
  when: not (rpi_exporter_skip | default(false))

- name: Install RPi Exporter
  ansible.builtin.unarchive:
    src: >-
      {{ repositories.rpi_exporter.base_url }}/v{{ software_versions.rpi_exporter }}/
      rpi_exporter-{{ software_versions.rpi_exporter }}.{{ rpi_exporter_arch }}.tar.gz
    dest: /tmp/
    remote_src: true
  when: not (rpi_exporter_skip | default(false))

- name: Copy RPi Exporter file to bin
  become: true
  ansible.builtin.copy:
    src: "/tmp/rpi_exporter-{{ software_versions.rpi_exporter }}.{{ rpi_exporter_arch }}/rpi_exporter"
    dest: "{{ paths.bin_dir }}/rpi_exporter"
    owner: "{{ rpi_exporter_userid }}"
    group: "{{ rpi_exporter_groupid }}"
    remote_src: true
    mode: "0755"
  notify: Restart rpi_exporter
  when: not (rpi_exporter_skip | default(false))

- name: Delete RPi Exporter tmp folder
  ansible.builtin.file:
    path: '/tmp/rpi_exporter-{{ software_versions.rpi_exporter }}.{{ rpi_exporter_arch }}'
    state: absent
  when: not (rpi_exporter_skip | default(false))

- name: Copy systemd init file
  become: true
  ansible.builtin.template:
    src: rpi_exporter.service.j2
    dest: "{{ paths.systemd_dir }}/rpi_exporter.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - systemd_reload
    - Restart rpi_exporter
  when: not (rpi_exporter_skip | default(false))

- name: Reload systemd daemon
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: not (rpi_exporter_skip | default(false))

- name: Start RPi Exporter service
  become: true
  ansible.builtin.service:
    name: rpi_exporter
    state: started
    enabled: true
  when: not (rpi_exporter_skip | default(false))

- name: Wait for rpi_exporter to be ready
  ansible.builtin.wait_for:
    port: "{{ rpi_exporter_port }}"
    delay: 2
    timeout: 30
  when: not (rpi_exporter_skip | default(false))

- name: Check if RPi exporter emits metrics
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ rpi_exporter_port }}/metrics"
    method: GET
    status_code: 200
  when: not (rpi_exporter_skip | default(false))
