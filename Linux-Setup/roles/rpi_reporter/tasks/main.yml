- name: Stop isp-rpi-reporter.service if present
  become: true
  ansible.builtin.systemd_service:
    name: isp-rpi-reporter.service
    state: stopped
  failed_when: false

- name: Disable isp-rpi-reporter.service if present
  ansible.builtin.systemd_service:
    name: isp-rpi-reporter.service
    enabled: false
  failed_when: false

- name: Delete the isp-rpi-reporter.service if present
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/isp-rpi-reporter.service
    state: absent
  failed_when: false

- name: Purge RPi-Reporter-MQTT2HA-Daemon if present
  ansible.builtin.file:
    path: /opt/RPi-Reporter-MQTT2HA-Daemon
    state: absent
  failed_when: false

- name: Git Clone RPi-Reporter-MQTT2HA-Daemon
  ansible.builtin.git:
    repo: "{{ repositories.rpi_reporter.git_url }}"
    dest: "{{ paths.opt_dir }}/RPi-Reporter-MQTT2HA-Daemon"
    single_branch: true
    version: v1.8.5

- name: Copy over the RPi-Reporter-MQTT2HA-Daemon config
  become: true
  ansible.builtin.template:
    src: "config.ini.j2"
    dest: "{{ paths.opt_dir }}/RPi-Reporter-MQTT2HA-Daemon/config.ini"
    owner: root
    group: daemon
    mode: "0640"

- name: Change ISP-RPi-mqtt-daemon.py ownership
  ansible.builtin.file:
    path: /opt/RPi-Reporter-MQTT2HA-Daemon/ISP-RPi-mqtt-daemon.py
    owner: root
    group: daemon

- name: Manually create the RPi-Reporter-MQTT2HA-Daemon .venv
  ansible.builtin.command:
    cmd: python -m venv /opt/RPi-Reporter-MQTT2HA-Daemon/.venv
    creates: /opt/RPi-Reporter-MQTT2HA-Daemon/.venv

- name: Upgrade pip .venv
  ansible.builtin.command:
    cmd: .venv/bin/pip3 install --upgrade pip
    chdir: "{{ paths.opt_dir }}/RPi-Reporter-MQTT2HA-Daemon"
  changed_when: true

- name: Upgrade wheel and setuptools
  ansible.builtin.command:
    cmd: .venv/bin/pip3 install --upgrade wheel setuptools
    chdir: "{{ paths.opt_dir }}/RPi-Reporter-MQTT2HA-Daemon"
  changed_when: true

- name: Install requirements into .venv
  ansible.builtin.command:
    cmd: .venv/bin/pip3 install -r requirements.txt
    chdir: "{{ paths.opt_dir }}/RPi-Reporter-MQTT2HA-Daemon"
  changed_when: true

- name: Copy over the isp-rpi-reporter.service
  become: true
  ansible.builtin.template:
    src: "isp-rpi-reporter.service.j2"
    dest: "{{ paths.systemd_dir }}/isp-rpi-reporter.service"
    owner: root
    group: root
    mode: "644"

- name: Enable isp-rpi-reporter.service
  become: true
  ansible.builtin.systemd_service:
    name: isp-rpi-reporter.service
    enabled: true
    state: started
