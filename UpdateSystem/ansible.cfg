[defaults]
# Inventory configuration
inventory = inventory/hosts.yml

# Logging
log_path = ~/.ansible/logs/updatesystem.log

# SSH configuration
host_key_checking = True

# Performance
forks = 5
# Always gather fresh facts: the update roles rely on current disk space and
# running kernel, so cached facts would give wrong pre-flight/reboot results
gathering = implicit

# Output
stdout_callback = default
callback_result_format = yaml
display_skipped_hosts = True
display_ok_hosts = True

# Retry configuration
retry_files_enabled = False

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
pipelining = True
