---
# Pi-hole Serial Update Playbook
# Updates Pi-hole servers one at a time, reboots only when needed, and verifies
# DNS is answering before moving on. At least one Pi-hole stays online throughout.

- name: Pi-hole Serial Update with Reboot and Verification
  hosts: pihole
  gather_facts: true
  become: true
  serial: 1  # Process one host at a time
  max_fail_percentage: 0  # Stop immediately if a server fails verification
  vars:
    # Reboot automatically when the OS reports one is needed (play vars
    # override group_vars; -e still overrides this)
    system_update_reboot_if_required: true
  tasks:
    - name: Display Pi-hole server being updated
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "Updating Pi-hole server: {{ inventory_hostname }}"
          - "IP: {{ ansible_facts['default_ipv4']['address'] | default('N/A') }}"
          - "System: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "=================================================="

    - name: Run update steps (system packages + Pi-hole)
      ansible.builtin.import_tasks: tasks/update_host.yml

    - name: Force reboot even though none is required
      ansible.builtin.reboot:
        reboot_timeout: "{{ system_update_reboot_timeout | default(600) }}"
        connect_timeout: 30
        pre_reboot_delay: 10
        post_reboot_delay: 30
        msg: "Rebooting {{ inventory_hostname }} after Pi-hole updates"
      register: pihole_update_serial_forced_reboot
      when:
        - pihole_update_serial_force_reboot | default(false)
        - not (system_update_rebooted | default(false))

    - name: Verify Pi-hole health and DNS
      ansible.builtin.import_tasks: tasks/verify_pihole.yml

    - name: Display verification results
      ansible.builtin.debug:
        msg:
          - "✅ Server {{ inventory_hostname }} verified"
          - "Rebooted: {{ (system_update_rebooted | default(false)) or (pihole_update_serial_forced_reboot is changed) }}"
          - "Pi-hole status: {{ pihole_status_post_update.stdout_lines | join(' | ') }}"
          - "FTL service: {{ ansible_facts['services']['pihole-FTL.service']['state'] }}"
          - "DNS ({{ pihole_update_verify_domain | default('google.com') }}): {{ pihole_dns_check.stdout_lines | join(', ') }}"

    - name: Pause before moving to next server
      ansible.builtin.pause:
        seconds: "{{ pihole_update_delay_between_servers | default(30) }}"
        prompt: "Waiting {{ pihole_update_delay_between_servers | default(30) }} seconds before updating next server..."
      when: inventory_hostname != ansible_play_hosts_all | last

- name: Final summary of all Pi-hole servers
  hosts: pihole
  strategy: linear  # required for run_once
  gather_facts: false
  become: false
  tasks:
    - name: Display final status summary
      ansible.builtin.debug:
        msg: >-
          {{ item }}:
          {{ hostvars[item].update_host_summary.packages }} package(s) pending before upgrade,
          {{ 'rebooted' if (hostvars[item].update_host_summary.rebooted
                            or hostvars[item].pihole_update_serial_forced_reboot is changed)
             else 'not rebooted' }},
          DNS verified
      loop: "{{ ansible_play_hosts_all }}"
      when: hostvars[item].update_host_summary is defined
      run_once: true  # noqa: run-once[task] - play strategy is pinned to linear
